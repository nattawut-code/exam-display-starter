<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - ตารางสอบ</title>
<link rel="stylesheet" href="style.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
</head>
<body class="admin-page">
<div class="admin">
  <div class="admin-head">
    <div>
      <h1>⚙️ จัดการตารางสอบ</h1>
      <p id="userInfo" class="muted">โหมดจัดการชั่วคราว — ไม่ต้องล็อกอิน</p>
    </div>
    <button id="logoutBtn" class="danger-btn">กลับหน้าจอแสดงผล</button>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="exams">📅 ตารางสอบ</button>
    <button class="tab-btn" data-tab="display">🖥️ การแสดงผล</button>
    <button class="tab-btn" data-tab="announce">📢 ประกาศ</button>
    <button class="tab-btn" data-tab="image">🖼️ รูปภาพ</button>
  </nav>

  <section class="tab-panel" id="panel-exams">
    <section class="admin-section"><h2>📅 เพิ่มตารางสอบ</h2>
      <div class="grid-2">
        <label>วันที่<input id="examDate" type="date"></label>
        <label>วิชา<input id="subject" placeholder="เช่น คณิตศาสตร์"></label>
        <label>เวลาเริ่ม<input id="startTime" type="time"></label>
        <label>เวลาสิ้นสุด<input id="endTime" type="time"></label>
        <label>ห้องสอบ<input id="room" placeholder="เช่น ห้อง 301"></label>
        <label>สถานะ<select id="enabled"><option value="true">แสดง</option><option value="false">ซ่อน</option></select></label>
      </div>
      <button id="addExam" class="primary-btn">＋ เพิ่มรายการ</button>
    </section>
    <section class="admin-section"><h2>📝 รายการตารางสอบ</h2><div id="examTable" class="table-wrap">กำลังโหลด...</div></section>
  </section>

  <section class="tab-panel" id="panel-display" hidden>
    <section class="admin-section"><h2>🖥️ การแสดงผลหน้าจอ</h2>
      <div class="grid-2">
        <label>ขนาดนาฬิกา <b id="clockValue">110</b> px<input id="clockSize" type="range" min="40" max="220"></label>
        <label>ขนาดรูป <b id="imageValue">90</b>%<input id="imageSize" type="range" min="30" max="100"></label>
        <label>ตำแหน่งนาฬิกา<select id="clockPosition"><option value="left">ซ้าย</option><option value="center">กลาง</option><option value="right">ขวา</option></select></label>
        <label>ตำแหน่งรูป<select id="imagePosition"><option value="top">ด้านบน</option><option value="center">กึ่งกลาง</option><option value="bottom">ด้านล่าง</option></select></label>
        <label>แสดงวันที่<select id="showDate"><option value="true">เปิด</option><option value="false">ปิด</option></select></label>
        <label>แสดงนาฬิกา<select id="showClock"><option value="true">เปิด</option><option value="false">ปิด</option></select></label>
        <label>แสดงตารางสอบ<select id="showSchedule"><option value="true">เปิด</option><option value="false">ปิด</option></select></label>
        <label>แสดงรูป<select id="showImage"><option value="true">เปิด</option><option value="false">ปิด</option></select></label>
      </div>
      <button id="saveSettings" class="primary-btn">💾 บันทึกการตั้งค่า</button>
    </section>
  </section>

  <section class="tab-panel" id="panel-announce" hidden>
    <section class="admin-section"><h2>📢 ประกาศ</h2>
      <textarea id="announcement" rows="3" placeholder="ข้อความประกาศบนหน้าจอ"></textarea>
      <label class="inline-check"><input id="showAnnouncement" type="checkbox"> แสดงประกาศ</label>
      <button id="saveAnnouncement" class="primary-btn">บันทึกประกาศ</button>
    </section>
  </section>

  <section class="tab-panel" id="panel-image" hidden>
    <section class="admin-section"><h2>🖼️ รูปตารางสอบ</h2>
      <input id="imageFile" type="file" accept="image/*">
      <div id="previewBox" class="preview-box">ยังไม่ได้เลือกรูป</div>
      <button id="uploadImage" class="primary-btn">☁️ อัปโหลดรูป</button>
      <button id="removeImage" class="danger-btn">ลบรูปจากหน้าจอ</button>
    </section>
  </section>

  <section class="admin-section links"><a href="index.html" target="_blank">📺 เปิดหน้าจอแสดงผล</a></section>
  <p id="status"></p>
</div>
<script src="supabase.js?v=2"></script>
<script src="admin.js?v=2"></script>
</body>
</html>
